<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <radialGradient id="ruinsBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#242823"/>
      <stop offset="60%" stop-color="#151915"/>
      <stop offset="100%" stop-color="#0a0c0a"/>
    </radialGradient>
    <pattern id="crackedStones" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="76" height="76" fill="#1b201b" stroke="#333d33" stroke-width="1.5" rx="3"/>
      <!-- Mossy patches -->
      <path d="M 10 10 Q 30 15 25 35 Q 15 25 10 10 Z" fill="#2d422d" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#ruinsBg)"/>
  <rect width="800" height="600" fill="url(#crackedStones)"/>
  <!-- Broken pillars and crumbling masonry -->
  <g fill="#2d332d" stroke="#505c50" stroke-width="2">
    <!-- Broken column bases -->
    <circle cx="160" cy="160" r="22"/>
    <circle cx="320" cy="160" r="22"/>
    <circle cx="480" cy="160" r="22" stroke-dasharray="8 6"/>
    <circle cx="640" cy="160" r="22"/>
    <circle cx="160" cy="440" r="22"/>
    <circle cx="320" cy="440" r="22" stroke-dasharray="6 4"/>
    <circle cx="480" cy="440" r="22"/>
    <circle cx="640" cy="440" r="22"/>
    <!-- Fallen column segments -->
    <rect x="340" y="260" width="140" height="30" rx="6" transform="rotate(15, 410, 275)" fill="#232723" stroke="#444e44"/>
    <!-- Overgrown altar -->
    <rect x="360" y="340" width="80" height="60" rx="4" fill="#263026" stroke="#556b55"/>
  </g>
</svg>
