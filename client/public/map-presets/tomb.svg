<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <radialGradient id="tombBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="60%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <pattern id="flagstones" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="58" height="58" fill="#181b20" stroke="#2d333b" stroke-width="1.5" rx="2"/>
      <line x1="15" y1="1" x2="15" y2="59" stroke="#101214" stroke-width="1" opacity="0.5"/>
      <line x1="1" y1="30" x2="59" y2="30" stroke="#101214" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#tombBg)"/>
  <rect width="800" height="600" fill="url(#flagstones)"/>
  <!-- Central Sarcophagus Crypt -->
  <g stroke="#485361" stroke-width="2">
    <!-- Grand Sarcophagus in Chamber Center -->
    <rect x="340" y="220" width="120" height="160" rx="6" fill="#252b33"/>
    <rect x="355" y="240" width="90" height="120" rx="4" fill="#1b2026"/>
    <!-- Carved effigy / cross -->
    <line x1="400" y1="260" x2="400" y2="340" stroke="#717f94" stroke-width="3"/>
    <line x1="375" y1="285" x2="425" y2="285" stroke="#717f94" stroke-width="3"/>
    <!-- Corner Sarcophagi / Alcoves -->
    <rect x="100" y="80" width="100" height="60" rx="4" fill="#20252c"/>
    <rect x="600" y="80" width="100" height="60" rx="4" fill="#20252c"/>
    <rect x="100" y="460" width="100" height="60" rx="4" fill="#20252c"/>
    <rect x="600" y="460" width="100" height="60" rx="4" fill="#20252c"/>
    <!-- Ancient chamber pillars -->
    <circle cx="260" cy="180" r="16" fill="#2d3540" stroke="#606f82"/>
    <circle cx="540" cy="180" r="16" fill="#2d3540" stroke="#606f82"/>
    <circle cx="260" cy="420" r="16" fill="#2d3540" stroke="#606f82"/>
    <circle cx="540" cy="420" r="16" fill="#2d3540" stroke="#606f82"/>
  </g>
</svg>
