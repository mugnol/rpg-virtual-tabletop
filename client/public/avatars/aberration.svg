<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="aberrationBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#aberrationBg)" stroke="#818cf8" stroke-width="3"/>
  <!-- Beholder Eye with Eyestalks -->
  <g fill="#4338ca" stroke="#312e81" stroke-width="2" stroke-linejoin="round">
    <!-- Eyestalks -->
    <path d="M30 32 Q20 20 28 14" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="28" cy="14" r="4" fill="#a5b4fc" stroke="#312e81" stroke-width="1.5"/>
    <path d="M50 26 Q50 14 50 10" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="50" cy="10" r="4" fill="#a5b4fc" stroke="#312e81" stroke-width="1.5"/>
    <path d="M70 32 Q80 20 72 14" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="72" cy="14" r="4" fill="#a5b4fc" stroke="#312e81" stroke-width="1.5"/>
    <!-- Central Body -->
    <circle cx="50" cy="56" r="26" fill="#3730a3"/>
    <!-- Great Eye -->
    <circle cx="50" cy="52" r="14" fill="#f8fafc"/>
    <circle cx="50" cy="52" r="7" fill="#dc2626"/>
    <circle cx="50" cy="52" r="3" fill="#000"/>
    <!-- Maw of needle teeth -->
    <path d="M38 72 Q50 82 62 72 Z" fill="#1e1b4b"/>
    <polygon points="42,72 44,76 46,72" fill="#fff" stroke="none"/>
    <polygon points="48,72 50,76 52,72" fill="#fff" stroke="none"/>
    <polygon points="54,72 56,76 58,72" fill="#fff" stroke="none"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#0f0c2e" stroke-width="1.5" opacity="0.6"/>
</svg>
