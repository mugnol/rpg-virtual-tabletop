  <g fill="#4d7c0f" stroke="#1c1917" stroke-width="2" stroke-linejoin="round">
    <path d="M50 20 C32 20 26 36 26 54 C26 72 38 78 50 80 C60 78 70 72 70 54 C70 36 66 20 50 20 Z"/>
