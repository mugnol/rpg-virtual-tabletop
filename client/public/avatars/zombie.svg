      <stop offset="0%" stop-color="#3f6212"/>
      <stop offset="100%" stop-color="#142b08"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#zombieBg)" stroke="#65a30d" stroke-width="3"/>
