services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpg-vtt-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vtt}:${POSTGRES_PASSWORD:-vttpassword}@db:5432/${POSTGRES_DB:-vtt}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rpg-vtt-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vtt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vttpassword}
      - POSTGRES_DB=${POSTGRES_DB:-vtt}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vtt} -d ${POSTGRES_DB:-vtt}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
